<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#041221" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Central Distinct Brand Mark for Taxcent Connect -->
  <!-- Top Horizontal Bar of T -->
  <rect x="116" y="130" width="280" height="48" rx="24" fill="url(#accentGrad)" />
  
  <!-- Vertical Stem of T -->
  <rect x="232" y="130" width="48" height="240" rx="24" fill="#ffffff" />
  
  <!-- 3 Interconnected Innovation Hub Nodes: Taxcent (Consulting/Finance), Quantum (Education), CSC (Digital India) -->
  <!-- Node 1: Left - Taxcent / Finance -->
  <circle cx="140" cy="310" r="32" fill="#0284c7" />
  <circle cx="140" cy="310" r="16" fill="#ffffff" />
  <line x1="168" y1="290" x2="232" y2="240" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

  <!-- Node 2: Right - Quantum Education -->
  <circle cx="372" cy="310" r="32" fill="#0284c7" />
  <circle cx="372" cy="310" r="16" fill="#ffffff" />
  <line x1="344" y1="290" x2="280" y2="240" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />

  <!-- Node 3: Bottom - CSC Ranabari -->
  <circle cx="256" cy="400" r="28" fill="#38bdf8" />
  <circle cx="256" cy="400" r="12" fill="#ffffff" />
  
  <!-- Subtle glowing connection lines -->
  <line x1="168" y1="324" x2="230" y2="386" stroke="rgba(56, 189, 248, 0.4)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" />
  <line x1="344" y1="324" x2="282" y2="386" stroke="rgba(56, 189, 248, 0.4)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6" />
</svg>
